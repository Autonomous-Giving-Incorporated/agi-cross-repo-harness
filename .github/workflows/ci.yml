name: Harness CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  # Network-dependent: fetches the AGI-consumed public documents at the pinned
  # revisions in refs/versions.json and runs the seam verifier against them.
  # Kept separate from the deterministic, network-free unit tests above.
  pinned-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node src/verify-pinned-sources.mjs

  # Network-dependent: fetches each consumer's workflow files at the SHAs in
  # refs/versions.json and fails closed if any `uses:` is a mutable tag/branch.
  pinned-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify suite actions are SHA-pinned
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node src/verify-pinned-actions.mjs

  # Data-level tenant isolation against a disposable Postgres service that carries
  # a synthetic replica of the AGI platform RLS slice (sql/tenant-isolation-slice.sql).
  # Synthetic data only; fails closed on any cross-tenant read.
  tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harness_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/harness_rls
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash scripts/verify-tenant-isolation.sh
